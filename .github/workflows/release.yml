name: Release Sentinel Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend & Tauri packages
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Sentinel V6 Desktop ${{ github.ref_name }}'
          releaseBody: |
            ## Sentinel V6 Desktop ${{ github.ref_name }}
            
            High-performance open-source Burp Suite & OWASP ZAP alternative built in Rust and Tauri.
            
            ### Highlights
            - ⚡ **Zero-JVM Native Memory**: Sub-100MB idle RAM consumption.
            - 🚀 **Unthrottled Intruder Fuzzer**: Native Tokio concurrency up to 30,000+ RPS.
            - 📡 **Native Out-of-Band (OAST)**: Built-in Burp Collaborator alternative powered by Interactsh.
            - 🎯 **Multi-Oracle SQL Injection Scanner**: Differential Boolean diffs & SPRT statistical timing.
            - 🌐 **Interception Proxy**: HTTP/1.1 and HTTP/2 proxy on `127.0.0.1:8085`.
            
            Download the pre-compiled installer for your operating system below.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
