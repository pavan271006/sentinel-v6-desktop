domain_model:
  lifecycle_pipeline:
    - "Transaction"
    - "Observation"
    - "Candidate"
    - "VerificationResult"
    - "Evidence"
    - "Finding"
  core_entities:
    - name: "Transaction"
      fields:
        - name: "meta"
        - name: "request"
        - name: "response"
        - name: "timing"
        - name: "tls_info"
    - name: "Observation"
      fields:
        - name: "meta"
        - name: "source"
        - name: "data_ref"
    - name: "Candidate"
      fields:
        - name: "meta"
        - name: "source_observation_id"
        - name: "hypothesis"
        - name: "status"
    - name: "VerificationResult"
      fields:
        - name: "success"
        - name: "confidence"
        - name: "evidence"
    - name: "Evidence"
      fields: []
    - name: "Finding"
      fields:
        - name: "meta"
        - name: "title"
        - name: "severity"
        - name: "state"
  supporting_entities:
    - name: "Scope"
    - name: "Endpoint"
    - name: "Payload"
    - name: "Identity"
    - name: "Session"
    - name: "Credential"
    - name: "SecretReference"
    - name: "Asset"
    - name: "Technology"
    - name: "State"
    - name: "Workflow"
    - name: "Resource"
    - name: "Action"
    - name: "Task"
    - name: "Report"
    - name: "RegressionTest"
    - name: "OASTInteraction"
    - name: "AttackPath"
    - name: "Note"
    - name: "Screenshot"
  enums:
    - name: "HttpMethod"
      variants: ["GET", "POST", "PUT", "DELETE"]
    - name: "Severity"
      variants: ["Critical", "High", "Medium", "Low", "Info"]
    - name: "FindingLifecycle"
      variants: ["Candidate", "Verified", "Confirmed"]

credential_security:
  model: "SecretReference"
  zero_plaintext_rules: ["Zero plaintext secrets stored in plain records"]
  secret_reference_specification:
    description: "UUID reference to secure keychain"
  supported_keychains: ["MacOS Keychain", "Windows Credential Manager", "Linux Secret Service"]

scope_model:
  policy: "FAIL_CLOSED_DEFAULT_DENY"
  decision_schema:
    struct_name: "ScopeDecision"
    fields:
      - name: "decision_id"
      - name: "allowed"
      - name: "reason"
      - name: "matched_rule"
      - name: "target"
      - name: "scope_version"
      - name: "timestamp"
  dns_rebinding_defense:
    description: "Post-DNS resolution checks"
  redos_protection:
    description: "Regex pattern limits"
  scope_rules:
    includes: "List of globs"
    excludes: "List of excludes"

interfaces_and_traits:
  traits:
    - name: "ProxyEngine"
      methods: [{name: "start"}, {name: "stop"}]
    - name: "HttpParser"
      methods: [{name: "parse_request"}, {name: "parse_response"}]
    - name: "ObservationStore"
      methods: [{name: "insert"}, {name: "query_sql"}]
    - name: "ScopeEngine"
      methods: [{name: "is_in_scope"}, {name: "update_scope"}]
    - name: "EventBus"
      methods: [{name: "publish_telemetry"}, {name: "publish_critical"}]
    - name: "TaskScheduler"
      methods: [{name: "submit"}, {name: "cancel"}]
    - name: "ScanOrchestrator"
      methods: [{name: "start_scan"}, {name: "pause_scan"}]
    - name: "FuzzerEngine"
      methods: [{name: "fuzz"}]
    - name: "VerificationEngine"
      methods: [{name: "verify_candidate"}, {name: "correlate_oast"}]
    - name: "ContextEngine"
      methods: [{name: "fingerprint"}, {name: "classify_parameter"}]
    - name: "CoverageEngine"
      methods: [{name: "record_test"}]
    - name: "IdentityManager"
      methods: [{name: "add_identity"}]
    - name: "KnowledgeEngine"
      methods: [{name: "add_node"}]
    - name: "ReportEngine"
      methods: [{name: "generate"}]
    - name: "BrowserService"
      methods: [{name: "navigate"}]
    - name: "OastServer"
      methods: [{name: "start"}]
    - name: "AuthorizationEngine"
      methods: [{name: "build_matrix"}]
    - name: "AiEngine"
      methods: [{name: "analyze"}, {name: "is_available"}]
    - name: "AiPolicyEngine"
      methods: [{name: "validate_input"}, {name: "is_destructive"}]
    - name: "PluginRuntime"
      methods: [{name: "load_wasm"}, {name: "execute"}]
    - name: "ResearchPackManager"
      methods: [{name: "load_pack"}, {name: "verify_signature"}]
    - name: "ExternalToolAdapter"
      methods: [{name: "execute"}, {name: "is_installed"}]
    - name: "SmtSolverEngine"
      methods: [{name: "prove_logic_flaw"}]
    - name: "RlStateEngine"
      methods: [{name: "explore_state_machine"}]
    - name: "CryptoAnalysisEngine"
      methods: [{name: "analyze_handshake"}]

events:
  channels:
    - name: "telemetry"
    - name: "critical"
  durable_events:
    - name: "FindingCreated"
  broadcast_events:
    - name: "ObservationCreated"

ipc_contracts:
  protobuf_package: "sentinel.v6.ipc"
  services:
    - name: "BrowserDaemon"
      rpcs:
        - name: "Navigate"
        - name: "ExecuteScript"
        - name: "CaptureDom"
        - name: "TakeScreenshot"
        - name: "Close"
  messages:
    - name: "Uuid"
    - name: "Timestamp"
    - name: "NavigateRequest"
    - name: "NavigateResponse"
    - name: "ExecuteScriptRequest"
    - name: "ExecuteScriptResponse"
    - name: "CaptureDomRequest"
    - name: "CaptureDomResponse"
    - name: "TakeScreenshotRequest"
    - name: "TakeScreenshotResponse"
    - name: "CloseRequest"
    - name: "CloseResponse"
    - name: "UiTrafficEvent"
    - name: "UiFindingEvent"
    - name: "SentinelUiStream"
    - name: "UiScanProgressEvent"
    - name: "UiTaskStatusEvent"
    - name: "UiCoverageEvent"
    - name: "UiContextEvent"
    - name: "UiScopeViolationEvent"
  streams:
    - name: "SentinelUiStream"

configuration:
  registries:
    - name: "core"

error_model:
  canonical_enum: "SentinelError"
  variants:
    - name: "ScopeViolation"
    - name: "NetworkTimeout"
  crash_safe_rules: ["Never panic on untrusted inputs"]

storage:
  sqlite:
    tables:
      - name: "scopes"
        columns: [{name: "id"}, {name: "version"}]
      - name: "graph_nodes"
        columns: [{name: "id"}, {name: "label"}]
      - name: "graph_edges"
        columns: [{name: "id"}, {name: "source_id"}, {name: "target_id"}]
        foreign_keys:
          - column: "source_id"
            foreign_table: "graph_nodes"
            foreign_column: "id"
          - column: "target_id"
            foreign_table: "graph_nodes"
            foreign_column: "id"
      - name: "endpoints"
        columns: [{name: "id"}, {name: "graph_node_id"}]
      - name: "parameters"
        columns: [{name: "id"}, {name: "endpoint_id"}]
      - name: "observations"
        columns: [{name: "id"}, {name: "data_ref"}]
      - name: "transactions"
        columns: [{name: "id"}, {name: "req_blob_id"}]
      - name: "identities"
        columns: [{name: "id"}]
      - name: "credentials"
        columns: [{name: "id"}]
      - name: "oast_tokens"
        columns: [{name: "id"}]
      - name: "oast_interactions"
        columns: [{name: "id"}]
      - name: "candidates"
        columns: [{name: "id"}]
      - name: "findings"
        columns: [{name: "id"}]
      - name: "task_checkpoints"
        columns: [{name: "id"}]
      - name: "scan_configs"
        columns: [{name: "id"}]
      - name: "proxy_intercept_rules"
        columns: [{name: "id"}]
  blob_store:
    path: ".sentinel/blobs"
    algorithm: "SHA-256"
    compression: "zstd"
  tantivy:
    index_path: ".sentinel/search"
    schema_fields: ["body_text", "headers"]
    sync_mode: "WAL_TAILING"

protocols:
  http1_1: {enabled: true}
  http2: {enabled: true}
  http3_quic: {enabled: true}
  tls: {enabled: true}
  websocket: {enabled: true}
  sse: {enabled: true}
  grpc: {enabled: true}

scanner_and_fuzzer:
  pipeline_stages: ["Detection", "Candidate", "Verification", "Evidence", "Finding"]
  fuzz_profile_schema: {name: "FuzzProfile"}
  mutator_types: ["BitFlip", "ByteReplace", "Grammar", "Wordlist", "Radamsa", "AI"]
  insertion_points: ["Query", "Body", "Header", "Path", "Cookie"]
  oracles: ["StatusCode", "Timing", "OAST", "DOMDiff"]
  resource_budget: {max_concurrent_requests: 50}
  minimization: {enabled: true}
  replay: {deterministic: true}
  stop_conditions: ["MaxRequests", "Duration", "TargetErrorRate"]

plugin_security:
  capability_set:
    network: false
    filesystem: false
    secrets: false
    database: false
    browser: false
  resource_limits:
    max_memory_mb: 64
    max_execution_ms: 5000
    max_network_requests: 0
  sandbox_modes: ["Wasmtime"]
  default_policy: "DENY"
  signature_verification: "Ed25519"

research_modules:
  feature_flag: "sentinel-research"
  modules:
    - name: "SmtSolverEngine"
    - name: "RlStateEngine"
    - name: "CryptoAnalysisEngine"
  isolation_invariants: ["Must never be linked into standard build without feature flag"]

ai_security:
  optionality_principle: "AI features are purely optional and auxiliary"
  untrusted_target_data_principle: "All data from target is untrusted"
  policy_layers: ["Input Sanitization", "Host AI Policy Engine", "Output Enforcement"]
  blocked_patterns: ["rm -rf", "drop table", "execute_system_command"]
  validation_schemas: ["AiRequest", "AiResponse"]

security_invariants:
  invariants:
    - id: "SEC-01"
      name: "Scope Authorization Invariant"
      statement: "No active outbound network packet may be transmitted without an explicit ScopeDecision."
      enforcement_layer: "ProxyEngine (SUB-01), ScopeEngine (SUB-04)"
      verification_test: "Unit test asserting out-of-scope URI fails closed."
    - id: "SEC-02"
      name: "OAST Token Confidentiality Invariant"
      statement: "Out-of-band interaction tokens must use AES-256 authenticated encryption."
      enforcement_layer: "OASTServer (SUB-16)"
      verification_test: "Token generation test confirming ciphertext entropy."
    - id: "SEC-03"
      name: "Host AI Policy Gate Invariant"
      statement: "All AI-generated strings must pass through AIPolicyEngine host-side policy."
      enforcement_layer: "AIPolicyEngine (SUB-19)"
      verification_test: "Policy test confirming destructive prompt is rejected."
    - id: "SEC-04"
      name: "WASM Capability Drop Invariant"
      statement: "WASM plugins execute with default-deny capabilities."
      enforcement_layer: "PluginRuntime (SUB-20)"
      verification_test: "Sandbox test verifying unpermitted socket traps."
    - id: "SEC-05"
      name: "Research Module Optionality Invariant"
      statement: "Research engines are feature-flagged behind sentinel-research."
      enforcement_layer: "Cargo crate feature architecture"
      verification_test: "Build and test command with --no-default-features succeeds."
    - id: "SEC-06"
      name: "Finding Proof Requirement Invariant"
      statement: "No Candidate may transition to Verified without empirical Evidence from VerificationEngine."
      enforcement_layer: "VerificationEngine (SUB-09)"
      verification_test: "State machine test verifying transition fails without evidence."
    - id: "SEC-07"
      name: "Evidence Immutability Invariant"
      statement: "Evidence blobs stored in blob storage are content-addressed with SHA-256."
      enforcement_layer: "ObservationStore (SUB-03)"
      verification_test: "Tamper test asserting modified blob content triggers SHA-256 mismatch."
    - id: "SEC-08"
      name: "Cross-Tenant Project Isolation Invariant"
      statement: "SQLite databases and blob directories are physically isolated per project."
      enforcement_layer: "ObservationStore (SUB-03)"
      verification_test: "Project switch test verifying project isolation."
    - id: "SEC-09"
      name: "Zero Plaintext Secrets Invariant"
      statement: "Credentials, API keys, and session tokens must use SecretReference UUID pointing to OS keychain with zero plaintext secrets."
      enforcement_layer: "IdentityManager (SUB-12)"
      verification_test: "Database audit test asserting zero plaintext secrets in storage."
    - id: "SEC-10"
      name: "Triple Representation Invariant"
      statement: "Every transaction retains byte-exact raw blob, parsed structured representation, and normalized text."
      enforcement_layer: "HTTPParser (SUB-02)"
