# Valid Minimal Spec for Unit Testing
metadata:
  version: "6.0.0"
  name: "Sentinel V6 Test Canonical Spec"
  description: "Test canonical specification fixture"
  schema_version: "1.0.0"
  status: "AUTHORITATIVE"
  date: "2026-08-17"

subsystems:
  taxonomy:
    core_count: 14
    professional_count: 7
    adapter_count: 4
    research_count: 3
    total_count: 28
  definitions:
    # Core 1..14
    - id: "SUB-01"
      name: "ProxyEngine"
      tier: "Core"
      crate: "sentinel-proxy"
      responsibilities: ["Intercept traffic"]
