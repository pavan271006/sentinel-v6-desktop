      events_consumed: []
      traits_provided: ["ProxyEngine"]
      traits_consumed: ["HttpParser", "ScopeEngine", "EventBus", "ObservationStore"]
      permissions: ["bind_network_sockets"]
      storage_access: ["transactions"]
      security_boundary: "Untrusted input"
