          description: "Records completion of a specific check against an endpoint parameter."
        - name: "get_coverage"
          args:
            - name: "scope_id"
              type: "Uuid"
          return_type: "Result<CoverageReport, SentinelError>"
          error_type: "SentinelError"
          description: "Computes overall endpoint and parameter coverage statistics for a scope."
        - name: "untested_endpoints"
          args:
            - name: "scope_id"
              type: "Uuid"
          return_type: "Result<Vec<Endpoint>, SentinelError>"
          error_type: "SentinelError"
          description: "Queries endpoints within scope that have untested parameters."

    - name: "IdentityManager"
      subsystem: "SUB-12"
      is_async: true
      description: "User identity, session management, and secure credential injection."
      methods:
        - name: "add_identity"
          args:
            - name: "identity"
              type: "Identity"
          return_type: "Result<Uuid, SentinelError>"
          error_type: "SentinelError"
          description: "Registers a new testing identity persona."
        - name: "add_credential"
          args:
            - name: "credential"
              type: "Credential"
            - name: "secret_bytes"
              type: "&[u8]"
          return_type: "Result<Uuid, SentinelError>"
          error_type: "SentinelError"
          description: "Stores secret bytes in OS Keychain vault and saves Credential metadata."
        - name: "list_identities"
          args: []
          return_type: "Result<Vec<Identity>, SentinelError>"
          error_type: "SentinelError"
          description: "Lists all configured identity personas."
        - name: "inject_auth"
          args:
            - name: "identity_id"
              type: "Uuid"
            - name: "request"
              type: "&mut ParsedRequest"
          return_type: "Result<(), SentinelError>"
          error_type: "SentinelError"
          description: "Resolves SecretReference in OS vault and injects headers into outgoing request."
        - name: "refresh_credential"
          args:
            - name: "identity_id"
              type: "Uuid"
          return_type: "Result<(), SentinelError>"
          error_type: "SentinelError"
          description: "Executes token refresh dance when receiving 401 Unauthorized."

    - name: "KnowledgeEngine"
      subsystem: "SUB-13"
      is_async: true
      description: "Knowledge graph topology store and attack path pathfinder."
      methods:
        - name: "add_node"
          args:
            - name: "node"
              type: "GraphNode"
          return_type: "Result<Uuid, SentinelError>"
          error_type: "SentinelError"
          description: "Inserts or updates a node in the knowledge graph."
