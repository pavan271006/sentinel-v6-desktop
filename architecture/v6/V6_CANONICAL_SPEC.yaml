              type: "&str"
          return_type: "bool"
          error_type: "None"
          description: "Checks if a proposed command contains destructive SQL or OS operations."
        - name: "requires_approval"
          args:
            - name: "command"
              type: "&str"
          return_type: "bool"
          error_type: "None"
          description: "Determines if an action requires interactive human approval."

