              type: "OastConfig"
          return_type: "Result<(), SentinelError>"
          error_type: "SentinelError"
          description: "Starts DNS, HTTP, and HTTPS listeners on configured ports."
        - name: "stop"
          args: []
          return_type: "Result<(), SentinelError>"
          error_type: "SentinelError"
          description: "Stops OAST listener servers."
        - name: "generate_token"
          args:
            - name: "context"
              type: "&str"
          return_type: "Result<String, SentinelError>"
          error_type: "SentinelError"
          description: "Generates an AES-256-GCM stateless correlation token."
        - name: "poll_interactions"
          args:
            - name: "token"
              type: "&str"
          return_type: "Result<Vec<OastInteraction>, SentinelError>"
          error_type: "SentinelError"
          description: "Polls for received callback interactions matching the token."

    - name: "AuthorizationEngine"
      subsystem: "SUB-17"
      is_async: true
      description: "Automated multi-role authorization and IDOR matrix testing engine."
      methods:
