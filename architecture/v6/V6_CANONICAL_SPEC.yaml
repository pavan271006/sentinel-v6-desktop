          args:
            - name: "matrix"
              type: "&AuthzMatrix"
          return_type: "Result<Vec<AuthzViolation>, SentinelError>"
          error_type: "SentinelError"
          description: "Executes cross-role requests and detects unauthorized access violations."

    - name: "AiEngine"
      subsystem: "SUB-18"
