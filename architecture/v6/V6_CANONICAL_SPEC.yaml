      security_boundary: "AES-256-GCM stateless tokens; constant-time invalid token drop; DoS resilience"

    - id: "SUB-17"
      name: "AuthorizationEngine"
      tier: "Professional"
      crate: "sentinel-authz"
      responsibilities:
