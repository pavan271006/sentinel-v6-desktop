      description: "Optional LLM hypothesis generator and payload synthesis accelerator."
      methods:
        - name: "analyze"
          args:
            - name: "request"
              type: "AiRequest"
          return_type: "Result<AiResponse, SentinelError>"
          error_type: "SentinelError"
          description: "Sends prompt context to configured LLM and returns structured completion."
        - name: "is_available"
          args: []
          return_type: "bool"
          error_type: "None"
          description: "Returns true if AI provider API keys and network access are operational."

    - name: "AiPolicyEngine"
      subsystem: "SUB-19"
      is_async: false
      description: "5-layer host-side security gate for AI prompts and completions."
      methods:
        - name: "validate_input"
          args:
            - name: "prompt"
              type: "&str"
          return_type: "PolicyResult"
          error_type: "None"
