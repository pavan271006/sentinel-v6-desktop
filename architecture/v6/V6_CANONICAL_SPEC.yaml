metadata:
  version: "6.0.0"
  name: "SENTINEL V6 Canonical Architecture Specification"
  description: "The authoritative machine-readable single source of truth for SENTINEL V6: The Security Researcher's Operating Environment."
  schema_version: "1.0.0"
  status: "AUTHORITATIVE"
  date: "2026-08-17"

# ==============================================================================
# 1. SUBSYSTEMS & TAXONOMY
# ==============================================================================
subsystems:
  taxonomy:
    core_count: 14
    professional_count: 7
    adapter_count: 4
    research_count: 3
    total_count: 28

  definitions:
    # --------------------------------------------------------------------------
    # CORE TIER (14 Subsystems) — Single Local Desktop Binary
    # --------------------------------------------------------------------------
    - id: "SUB-01"
      name: "ProxyEngine"
      tier: "Core"
      crate: "sentinel-proxy"
      responsibilities:
        - "Intercept, inspect, and modify HTTP/1.1, HTTP/2, and WebSocket network traffic"
        - "Enforce ScopeEngine network decisions prior to socket connection"
        - "Preserve raw byte stream representation and emit ObservationCreated events"
        - "Apply active and passive interception rules (drop, modify, log)"
      dependencies:
        - "HTTPParser"
        - "ScopeEngine"
        - "EventBus"
        - "ObservationStore"
      events_emitted:
        - "ObservationCreated"
      events_consumed: []
      traits_provided:
        - "ProxyEngine"
      traits_consumed:
        - "HttpParser"
        - "ScopeEngine"
        - "EventBus"
        - "ObservationStore"
      permissions:
        - "bind_network_sockets"
        - "intercept_traffic"
      storage_access:
        - "transactions"
        - "proxy_intercept_rules"
        - "blobs"
      security_boundary: "Untrusted network input; 10MB memory allocation bound per transaction"

    - id: "SUB-02"
      name: "HTTPParser"
      tier: "Core"
      crate: "sentinel-parser"
      responsibilities:
        - "Byte-safe, fault-tolerant parsing of HTTP/1.1 and HTTP/2 requests and responses"
        - "Preserve raw delimiter whitespace and byte-exact fidelity without normalization loss"
        - "Detect and emit structured ParseWarning items for request smuggling analysis"
        - "Serialize structured request and response objects back to byte streams"
      dependencies: []
      events_emitted: []
      events_consumed: []
      traits_provided:
        - "HttpParser"
      traits_consumed: []
      permissions: []
      storage_access: []
      security_boundary: "Forked httparse parser; differential parser protection; zero-panic guarantees on malformed input"

    - id: "SUB-03"
      name: "ObservationStore"
      tier: "Core"
      crate: "sentinel-store"
      responsibilities:
        - "Provide ACID dual-write persistence for metadata in SQLite (WAL mode)"
        - "Provide BM25 full-text search indexing over transaction bodies via Tantivy"
        - "Manage content-addressed (SHA-256) blob store for raw payload storage"
        - "Auto-rebuild Tantivy search indexes from SQLite WAL on startup if corrupted"
      dependencies: []
      events_emitted: []
      events_consumed:
        - "FindingCreated"
        - "CandidateVerified"
      traits_provided:
        - "ObservationStore"
      traits_consumed: []
      permissions:
        - "filesystem_read_write"
      storage_access:
        - "all_sqlite_tables"
        - "blob_store"
        - "tantivy_indices"
      security_boundary: "Single-writer async channel; encrypted secrets at rest; zero plaintext storage"

    - id: "SUB-04"
      name: "ScopeEngine"
      tier: "Core"
      crate: "sentinel-scope"
      responsibilities:
        - "Enforce fail-closed (Default DENY) network access control list (ACL)"
        - "Evaluate hostnames, URIs, and post-resolution socket IP addresses against scope rules"
        - "Prevent SSRF and DNS rebinding attacks by validating resolved socket addresses"
        - "Execute regex rule matching under strict length (<=1000) and time (<=100ms) bounds"
      dependencies: []
      events_emitted: []
      events_consumed: []
      traits_provided:
        - "ScopeEngine"
      traits_consumed: []
      permissions: []
      storage_access:
        - "scopes"
      security_boundary: "Fail-closed default DENY policy; ReDoS bounded regex engine; socket-level IP binding"

    - id: "SUB-05"
      name: "EventBus"
      tier: "Core"
      crate: "sentinel-bus"
      responsibilities:
        - "Two-tier asynchronous pub/sub messaging infrastructure"
        - "Broadcast channel (tokio::sync::broadcast, 10,000 capacity) for telemetry and UI updates"
        - "Guaranteed mpsc channel (tokio::sync::mpsc) with publisher backpressure for critical findings"
        - "Route events between core engines, adapters, and UI Tauri IPC streams"
      dependencies: []
      events_emitted: []
      events_consumed: []
      traits_provided:
        - "EventBus"
      traits_consumed: []
      permissions: []
      storage_access: []
      security_boundary: "Strict memory isolation; bounded queue capacities; telemetry drop-on-lag"

    - id: "SUB-06"
      name: "TaskScheduler"
      tier: "Core"
      crate: "sentinel-scheduler"
      responsibilities:
        - "Manage priority queue of asynchronous scanning, fuzzing, and analysis background tasks"
        - "Enforce ResourceBudget limits (max requests, duration, memory, concurrency, bandwidth)"
        - "Persist task execution checkpoints into SQLite for crash recovery and resume"
        - "Support task lifecycle states: Pending, Running, Paused, Completed, Failed, Cancelled"
      dependencies:
        - "EventBus"
      events_emitted:
        - "TaskStatus"
      events_consumed: []
      traits_provided:
        - "TaskScheduler"
      traits_consumed:
        - "EventBus"
      permissions: []
      storage_access:
        - "task_checkpoints"
      security_boundary: "Bounded concurrency and memory limits per task; safe task cancellation tokens"

    - id: "SUB-07"
      name: "ScanOrchestrator"
      tier: "Core"
      crate: "sentinel-scanner"
      responsibilities:
        - "Orchestrate multi-phase active scanning workflows across target endpoints"
        - "Evaluate ScopeEngine authorization before dispatching test jobs"
        - "Coordinate task scheduling, fuzzer mutation streams, and verification engines"
        - "Track real-time scan progress, completed checks, and phase transitions"
      dependencies:
        - "TaskScheduler"
        - "FuzzerEngine"
        - "CoverageEngine"
        - "ScopeEngine"
        - "EventBus"
      events_emitted:
        - "ScanProgress"
      events_consumed: []
      traits_provided:
        - "ScanOrchestrator"
      traits_consumed:
        - "TaskScheduler"
        - "FuzzerEngine"
        - "CoverageEngine"
        - "ScopeEngine"
        - "EventBus"
      permissions: []
      storage_access:
        - "scan_configs"
        - "endpoints"
      security_boundary: "Scope pre-validation before test dispatch; state machine pause/resume bounds"

    - id: "SUB-08"
      name: "FuzzerEngine"
      tier: "Core"
      crate: "sentinel-fuzzer"
      responsibilities:
        - "Generate structured and mutated test payloads based on FuzzProfile configurations"
        - "Support 10 mutation algorithms: BitFlip, ByteReplace, Grammar, Wordlist, Radamsa, Boundary, Unicode, Truncation, FormatString, AI"
        - "Inject test values across 10 insertion points (Query, Body, Header, Path, Cookie, JsonPath, XPath, Multipart, GraphQL, WS)"
        - "Evaluate mutation stream rate limits and resource budget stop conditions"
      dependencies:
        - "HTTPParser"
      events_emitted: []
      events_consumed: []
      traits_provided:
        - "FuzzerEngine"
      traits_consumed:
        - "HttpParser"
      permissions: []
      storage_access: []
      security_boundary: "Safe non-destructive payloads by default; Rayon thread pool concurrency limits"

    - id: "SUB-09"
      name: "VerificationEngine"
      tier: "Core"
      crate: "sentinel-verify"
      responsibilities:
        - "Execute active verification strategies to prove vulnerability existence without false positives"
        - "Support 10 verification strategies: BrowserExecution, OASTCorrelation, TimingStatistical, ResponseDifferential, StateVerification, AuthorizationReplay, ContentVerification, MathematicalVerification, ErrorClassification, CausalMinimization"
        - "Bind immutable, content-addressed Evidence to confirmed findings"
        - "Correlate out-of-band OAST interactions with candidate hypotheses"
      dependencies:
        - "ObservationStore"
      events_emitted:
        - "FindingCreated"
        - "CandidateVerified"
      events_consumed: []
      traits_provided:
        - "VerificationEngine"
      traits_consumed:
        - "ObservationStore"
      permissions: []
      storage_access:
        - "candidates"
        - "verifications"
        - "evidence"
        - "findings"
      security_boundary: "Mandatory empirical evidence requirement; non-destructive proof constraints"

    - id: "SUB-10"
      name: "ContextEngine"
      tier: "Core"
      crate: "sentinel-context"
      responsibilities:
        - "Passively fingerprint server technologies, frameworks, and web architectures from transactions"
        - "Classify parameter semantics (UUID, JWT, Base64, Email, ObjectId, URL, FilePath, etc.)"
        - "Feed detected context to ScanOrchestrator for intelligent test selection"
        - "Execute regex signature rules with strict length and execution time bounds"
      dependencies:
        - "ObservationStore"
      events_emitted:
        - "ContextDetected"
      events_consumed: []
      traits_provided:
        - "ContextEngine"
      traits_consumed:
        - "ObservationStore"
      permissions: []
      storage_access:
        - "graph_nodes"
      security_boundary: "ReDoS bounded signature evaluation; payload inspection ceiling (5MB max)"

    - id: "SUB-11"
      name: "CoverageEngine"
      tier: "Core"
      crate: "sentinel-coverage"
      responsibilities:
        - "Track attack surface exploration and testing depth across endpoints and parameters"
        - "Record completed security checks per parameter to prevent redundant testing"
        - "Calculate quantitative coverage metrics (endpoints tested, parameters tested, percentage)"
        - "Query untested endpoints and parameters for next-test prioritization"
      dependencies:
        - "ObservationStore"
      events_emitted:
        - "CoverageUpdate"
      events_consumed: []
      traits_provided:
        - "CoverageEngine"
      traits_consumed:
        - "ObservationStore"
      permissions: []
      storage_access:
        - "endpoints"
        - "parameters"
      security_boundary: "Accurate parameter coverage metrics; in-memory deduplication"

    - id: "SUB-12"
      name: "IdentityManager"
      tier: "Core"
      crate: "sentinel-identity"
      responsibilities:
        - "Manage user identities, test personas, role contexts, and active sessions"
        - "Integrate with OS Keychain / secure vault to resolve SecretReference UUIDs"
        - "Inject authentication headers, cookies, and tokens into outgoing requests in-memory"
        - "Zeroize decrypted credential buffers immediately after socket transmission"
      dependencies:
        - "ObservationStore"
      events_emitted: []
      events_consumed: []
      traits_provided:
        - "IdentityManager"
      traits_consumed:
        - "ObservationStore"
      permissions:
        - "keychain_access"
      storage_access:
        - "identities"
        - "credentials"
        - "sessions"
      security_boundary: "Zero plaintext secrets in DB, logs, or events; ephemeral in-memory zeroization"

    - id: "SUB-13"
      name: "KnowledgeEngine"
      tier: "Core"
      crate: "sentinel-knowledge"
      responsibilities:
        - "Maintain topology graph of discovered assets, domains, IPs, services, and endpoints"
        - "Execute graph traversal algorithms (shortest attack path, neighborhood exploration)"
        - "Enforce bounded recursive CTE query depth (max depth <= 5) in SQLite"
        - "Resolve multi-source entity relationships into unified graph nodes and edges"
      dependencies:
        - "ObservationStore"
      events_emitted: []
      events_consumed: []
      traits_provided:
        - "KnowledgeEngine"
      traits_consumed:
        - "ObservationStore"
      permissions: []
      storage_access:
        - "graph_nodes"
        - "graph_edges"
        - "attack_paths"
      security_boundary: "Bounded recursive query depth; cycle detection in attack path traversal"

    - id: "SUB-14"
      name: "ReportEngine"
      tier: "Core"
      crate: "sentinel-report"
      responsibilities:
        - "Export confirmed vulnerability findings into structured report formats (PDF, Markdown, JSON, HTML)"
        - "Assemble content-addressed evidence, reproduction steps, and remediation guidance"
        - "Sanitize finding descriptions to prevent HTML/script injection in generated reports"
        - "Operate in isolated sandboxed file generation environment"
      dependencies:
        - "ObservationStore"
      events_emitted: []
      events_consumed: []
      traits_provided:
        - "ReportEngine"
      traits_consumed:
        - "ObservationStore"
      permissions:
        - "filesystem_write"
      storage_access:
        - "findings"
        - "verifications"
        - "evidence"
        - "reports"
      security_boundary: "Sandboxed template rendering; no external network fetches during report generation"

