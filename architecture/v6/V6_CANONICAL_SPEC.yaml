          description: "Executes an active verification test against a vulnerability hypothesis."
        - name: "correlate_oast"
          args:
            - name: "token"
              type: "&str"
          return_type: "Result<Option<OastEvidence>, SentinelError>"
          error_type: "SentinelError"
          description: "Correlates an out-of-band interaction token with candidate hypotheses."
        - name: "available_strategies"
          args: []
          return_type: "Vec<VerificationStrategy>"
          error_type: "None"
          description: "Lists all currently enabled verification strategy modules."

    - name: "ContextEngine"
      subsystem: "SUB-10"
      is_async: false
      description: "Passive technology fingerprinting and parameter semantic classifier."
      methods:
        - name: "fingerprint"
          args:
            - name: "transaction"
              type: "&Transaction"
          return_type: "Vec<TechFingerprint>"
          error_type: "None"
          description: "Detects software stack technologies from HTTP exchange headers and bodies."
        - name: "classify_parameter"
          args:
            - name: "name"
              type: "&str"
            - name: "value"
              type: "&str"
          return_type: "ParameterClass"
          error_type: "None"
          description: "Classifies parameter semantic data type (UUID, JWT, Email, URL, etc.)."

    - name: "CoverageEngine"
      subsystem: "SUB-11"
      is_async: true
      description: "Attack surface exploration and security testing coverage mapper."
      methods:
        - name: "record_test"
          args:
            - name: "endpoint_id"
              type: "Uuid"
            - name: "param"
              type: "&str"
            - name: "check_id"
              type: "&str"
          return_type: "Result<(), SentinelError>"
