          args:
            - name: "edge"
              type: "GraphEdge"
          return_type: "Result<Uuid, SentinelError>"
          error_type: "SentinelError"
          description: "Inserts a relationship edge connecting two graph nodes."
        - name: "query_neighbors"
          args:
            - name: "node_id"
              type: "Uuid"
          return_type: "Result<Vec<GraphNode>, SentinelError>"
          error_type: "SentinelError"
          description: "Queries all adjacent neighboring nodes."
        - name: "find_path"
          args:
            - name: "from"
              type: "Uuid"
            - name: "to"
              type: "Uuid"
            - name: "max_depth"
              type: "u32"
          return_type: "Result<Vec<Vec<GraphEdge>>, SentinelError>"
          error_type: "SentinelError"
          description: "Finds shortest attack paths between two nodes with bounded CTE depth."
        - name: "resolve_entity"
          args:
            - name: "identifier"
              type: "&str"
          return_type: "Result<Option<GraphNode>, SentinelError>"
          error_type: "SentinelError"
          description: "Resolves a domain, IP, or ARN string to its existing GraphNode."

    - name: "ReportEngine"
      subsystem: "SUB-14"
      is_async: true
      description: "Structured vulnerability report exporter."
      methods:
        - name: "generate"
          args:
            - name: "config"
              type: "ReportConfig"
          return_type: "Result<Vec<u8>, SentinelError>"
          error_type: "SentinelError"
          description: "Generates report document byte buffer in requested format (PDF, Markdown, JSON, HTML)."

    - name: "BrowserService"
      subsystem: "SUB-15"
      is_async: true
      description: "Out-of-process Playwright browser runner coordinator."
      methods:
        - name: "navigate"
          args:
            - name: "url"
              type: "&str"
            - name: "timeout_ms"
              type: "u32"
          return_type: "Result<NavigationResult, SentinelError>"
          error_type: "SentinelError"
          description: "Navigates browser context to target URL and awaits DOM stabilization."
        - name: "execute_script"
          args:
            - name: "js"
              type: "&str"
            - name: "timeout_ms"
              type: "u32"
          return_type: "Result<String, SentinelError>"
          error_type: "SentinelError"
          description: "Executes JavaScript in page context and returns JSON-serialized result."
        - name: "capture_dom"
          args:
            - name: "include_shadow"
              type: "bool"
          return_type: "Result<String, SentinelError>"
          error_type: "SentinelError"
          description: "Captures full DOM HTML tree including shadow DOM roots."
        - name: "take_screenshot"
          args:
            - name: "full_page"
              type: "bool"
          return_type: "Result<Vec<u8>, SentinelError>"
          error_type: "SentinelError"
          description: "Captures page screenshot as PNG byte buffer."
        - name: "close"
          args: []
          return_type: "Result<(), SentinelError>"
          error_type: "SentinelError"
          description: "Closes browser daemon instance and releases resources."

    - name: "OastServer"
      subsystem: "SUB-16"
      is_async: true
      description: "Out-of-band correlation listener server."
      methods:
        - name: "start"
          args:
