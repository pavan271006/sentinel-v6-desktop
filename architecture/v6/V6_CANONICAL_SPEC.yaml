    - name: "ExternalToolAdapter"
      subsystem: "SUB-24"
      is_async: true
      description: "SemgrepAdapter process-isolated tool adapter."
      methods:
        - name: "tool_name"
          args: []
          return_type: "&str"
          error_type: "None"
          description: "Returns 'Semgrep'."
        - name: "is_installed"
          args: []
          return_type: "bool"
          error_type: "None"
          description: "Checks if semgrep binary exists in PATH."
        - name: "execute"
          args:
            - name: "config"
              type: "serde_json::Value"
          return_type: "Result<serde_json::Value, SentinelError>"
          error_type: "SentinelError"
          description: "Executes Semgrep SAST scan over source files."

    - name: "ExternalToolAdapter"
      subsystem: "SUB-25"
      is_async: true
      description: "OpenApiParser process-isolated tool adapter."
      methods:
        - name: "tool_name"
          args: []
          return_type: "&str"
          error_type: "None"
          description: "Returns 'OpenApiParser'."
        - name: "is_installed"
          args: []
          return_type: "bool"
          error_type: "None"
          description: "In-process deterministic parser (always returns true)."
        - name: "execute"
          args:
            - name: "config"
              type: "serde_json::Value"
          return_type: "Result<serde_json::Value, SentinelError>"
          error_type: "SentinelError"
          description: "Parses OpenAPI/Swagger specification text into PRoutes."

    - name: "SmtSolverEngine"
      subsystem: "SUB-26"
      is_async: true
      feature_flag: "sentinel-research"
      description: "Formal methods and Z3 symbolic reasoning engine."
      methods:
        - name: "prove_logic_flaw"
          args:
            - name: "source_code"
              type: "&str"
            - name: "invariant"
              type: "&str"
          return_type: "Result<SymbolicPath, SentinelError>"
          error_type: "SentinelError"
          description: "Proves whether a code state machine can violate a security invariant."

    - name: "RlStateEngine"
      subsystem: "SUB-27"
      is_async: true
      feature_flag: "sentinel-research"
      description: "Deep reinforcement learning state exploration engine."
      methods:
        - name: "explore_state_machine"
          args:
            - name: "initial_url"
              type: "&str"
          return_type: "Result<Vec<RlRewardModel>, SentinelError>"
          error_type: "SentinelError"
          description: "Discovers hidden application states via automated deep reinforcement learning exploration."

    - name: "CryptoAnalysisEngine"
      subsystem: "SUB-28"
      is_async: true
      feature_flag: "sentinel-research"
      description: "Cryptanalysis and lattice reduction analyzer."
      methods:
        - name: "analyze_handshake"
          args:
            - name: "pcap_data"
              type: "&[u8]"
          return_type: "Result<Option<CryptoWeakness>, SentinelError>"
          error_type: "SentinelError"
          description: "Analyzes captured TLS/crypto handshakes for lattice reduction or nonce reuse weaknesses."

# ==============================================================================
# 6. EVENTS & CHANNELS REGISTRY
# ==============================================================================
events:
  channels:
    - name: "Standard Broadcast (Telemetry)"
      rust_channel: "tokio::sync::broadcast::Sender<SentinelEvent>"
      capacity: 10000
      delivery_guarantee: "Best-effort"
      backpressure_behavior: "Drop oldest messages on consumer lag"
    - name: "Critical Channel (Auditable Findings)"
      rust_channel: "tokio::sync::mpsc::Sender<CriticalEvent>"
      capacity: "Unbounded (bounded by backpressure)"
      delivery_guarantee: "Guaranteed delivery"
      backpressure_behavior: "Publisher yields (async block) on saturation; appended to SQLite WAL"

  durable_events:
    - name: "FindingCreated"
      enum_variant: "CriticalEvent::FindingCreated(Uuid)"
      producer: "VerificationEngine (SUB-09)"
      consumers:
        - "ObservationStore (SUB-03)"
        - "UI Stream"
      payload_schema: "Uuid (Finding ID)"
      ipc_mapping: "UiFindingEvent (tag 2)"

    - name: "CandidateVerified"
      enum_variant: "CriticalEvent::CandidateVerified(Uuid)"
      producer: "VerificationEngine (SUB-09)"
      consumers:
        - "ObservationStore (SUB-03)"
        - "UI Stream"
      payload_schema: "Uuid (Candidate ID)"
      ipc_mapping: "UiCandidateVerifiedEvent (tag 8)"

    - name: "ScopeViolationAttempt"
      enum_variant: "CriticalEvent::ScopeViolationAttempt { source: String, target: String, decision: ScopeDecision }"
      producer: "ProxyEngine (SUB-01), ScopeEngine (SUB-04)"
      consumers:
        - "UI Stream"
        - "Audit Logger"
      payload_schema: "{ request_id: Uuid, attempted_uri: String, violation_reason: String, target: String, timestamp: DateTime<Utc> }"
      ipc_mapping: "UiScopeViolationEvent (tag 7)"

  broadcast_events:
    - name: "ObservationCreated"
      enum_variant: "SentinelEvent::ObservationCreated(Uuid)"
      producer: "ProxyEngine (SUB-01)"
      consumers:
        - "ObservationStore (SUB-03)"
        - "UI Stream"
      payload_schema: "Uuid (Transaction ID)"
      ipc_mapping: "UiTrafficEvent (tag 1)"

    - name: "ContextDetected"
      enum_variant: "SentinelEvent::ContextDetected(Uuid)"
      producer: "ContextEngine (SUB-10)"
      consumers:
        - "UI Stream"
        - "ScanOrchestrator (SUB-07)"
      payload_schema: "Uuid (Endpoint ID)"
      ipc_mapping: "UiContextEvent (tag 6)"

    - name: "CoverageUpdate"
      enum_variant: "SentinelEvent::CoverageUpdate(Uuid)"
      producer: "CoverageEngine (SUB-11)"
      consumers:
        - "UI Stream"
        - "ScanOrchestrator (SUB-07)"
      payload_schema: "Uuid (Scope ID)"
      ipc_mapping: "UiCoverageEvent (tag 5)"

    - name: "ScanProgress"
      enum_variant: "SentinelEvent::ScanProgress(ScanProgressUpdate)"
      producer: "ScanOrchestrator (SUB-07)"
      consumers:
        - "UI Stream"
      payload_schema: "ScanProgressUpdate { scan_id: Uuid, state: ScanLifecycle, progress_pct: f32, checks_completed: u64, timestamp: DateTime<Utc> }"
      ipc_mapping: "UiScanProgressEvent (tag 3)"

    - name: "TaskStatus"
      enum_variant: "SentinelEvent::TaskStatus(TaskStateUpdate)"
      producer: "TaskScheduler (SUB-06)"
      consumers:
        - "UI Stream"
      payload_schema: "TaskStateUpdate { task_id: Uuid, state: TaskLifecycle, progress_pct: f32, error: Option<String>, timestamp: DateTime<Utc> }"
      ipc_mapping: "UiTaskStatusEvent (tag 4)"

# ==============================================================================
# 7. IPC CONTRACTS & PROTOBUF DEFINITIONS
# ==============================================================================
ipc_contracts:
  protobuf_package: "sentinel.v6.ipc"
  services:
    - name: "BrowserDaemon"
      rpcs:
        - name: "Navigate"
          request: "NavigateRequest"
          response: "NavigateResponse"
        - name: "ExecuteScript"
          request: "ExecuteScriptRequest"
          response: "ExecuteScriptResponse"
        - name: "CaptureDom"
          request: "CaptureDomRequest"
          response: "CaptureDomResponse"
        - name: "TakeScreenshot"
          request: "TakeScreenshotRequest"
          response: "TakeScreenshotResponse"
        - name: "Close"
          request: "CloseRequest"
          response: "CloseResponse"

  messages:
    - name: "Uuid"
      fields:
        - tag: 1
          name: "value"
          type: "string"

    - name: "Timestamp"
      fields:
        - tag: 1
          name: "seconds"
          type: "int64"
        - tag: 2
          name: "nanos"
          type: "int32"

    - name: "NavigateRequest"
      fields:
        - tag: 1
          name: "url"
          type: "string"
        - tag: 2
          name: "timeout_ms"
          type: "int32"
        - tag: 3
          name: "custom_headers"
          type: "map<string, string>"
        - tag: 4
          name: "bypass_csp"
          type: "bool"

    - name: "NavigateResponse"
      fields:
        - tag: 1
          name: "success"
          type: "bool"
        - tag: 2
          name: "http_status"
          type: "int32"
        - tag: 3
          name: "error_message"
          type: "string"

    - name: "ExecuteScriptRequest"
      fields:
        - tag: 1
          name: "javascript_code"
          type: "string"
        - tag: 2
          name: "await_promise"
          type: "bool"
        - tag: 3
          name: "timeout_ms"
          type: "int32"

    - name: "ExecuteScriptResponse"
      fields:
        - tag: 1
          name: "success"
          type: "bool"
        - tag: 2
          name: "result_json"
          type: "string"
        - tag: 3
          name: "error_message"
          type: "string"

    - name: "CaptureDomRequest"
      fields:
        - tag: 1
          name: "include_shadow_dom"
          type: "bool"

    - name: "CaptureDomResponse"
      fields:
        - tag: 1
          name: "html_content"
          type: "string"

    - name: "TakeScreenshotRequest"
      fields:
        - tag: 1
          name: "full_page"
          type: "bool"

    - name: "TakeScreenshotResponse"
      fields:
        - tag: 1
          name: "image_png"
          type: "bytes"

    - name: "CloseRequest"
      fields: []

    - name: "CloseResponse"
      fields: []

    - name: "UiTrafficEvent"
      fields:
        - tag: 1
          name: "transaction_id"
          type: "Uuid"
        - tag: 2
          name: "timestamp"
          type: "Timestamp"
        - tag: 3
          name: "method"
          type: "string"
        - tag: 4
          name: "uri"
          type: "string"
        - tag: 5
          name: "status"
          type: "int32"
        - tag: 6
          name: "duration_ms"
          type: "int32"
        - tag: 7
          name: "in_scope"
          type: "bool"
        - tag: 8
          name: "tags"
          type: "repeated string"

    - name: "UiFindingEvent"
      fields:
        - tag: 1
          name: "finding_id"
          type: "Uuid"
        - tag: 2
          name: "timestamp"
          type: "Timestamp"
        - tag: 3
          name: "title"
          type: "string"
        - tag: 4
          name: "severity"
          type: "Severity"
        - tag: 5
          name: "state"
          type: "FindingLifecycle"

    - name: "UiScanProgressEvent"
      fields:
        - tag: 1
          name: "scan_id"
          type: "Uuid"
        - tag: 2
          name: "phase"
          type: "string"
        - tag: 3
          name: "percent_complete"
          type: "float"

    - name: "UiTaskStatusEvent"
      fields:
        - tag: 1
          name: "task_id"
          type: "Uuid"
        - tag: 2
          name: "state"
          type: "TaskState"
        - tag: 3
          name: "message"
          type: "string"

    - name: "UiCoverageEvent"
      fields:
        - tag: 1
          name: "scope_id"
          type: "Uuid"
        - tag: 2
          name: "total_endpoints"
          type: "uint32"
        - tag: 3
          name: "tested_endpoints"
          type: "uint32"
        - tag: 4
          name: "coverage_percent"
          type: "float"

    - name: "UiContextEvent"
      fields:
        - tag: 1
          name: "endpoint_id"
          type: "Uuid"
        - tag: 2
          name: "technology"
          type: "string"
        - tag: 3
          name: "confidence"
          type: "float"

    - name: "UiScopeViolationEvent"
      fields:
        - tag: 1
          name: "request_id"
          type: "Uuid"
        - tag: 2
          name: "attempted_uri"
          type: "string"
        - tag: 3
          name: "violation_reason"
          type: "string"
        - tag: 4
          name: "timestamp"
          type: "Timestamp"

    - name: "UiCandidateVerifiedEvent"
      fields:
        - tag: 1
          name: "candidate_id"
          type: "Uuid"
        - tag: 2
          name: "verification_id"
          type: "Uuid"
        - tag: 3
          name: "strategy"
          type: "string"
        - tag: 4
          name: "success"
          type: "bool"
        - tag: 5
          name: "timestamp"
          type: "Timestamp"

  streams:
    - name: "SentinelUiStream"
      oneof_field: "event"
      mappings:
        - tag: 1
          name: "traffic"
          type: "UiTrafficEvent"
        - tag: 2
          name: "finding"
          type: "UiFindingEvent"
        - tag: 3
          name: "scan_progress"
          type: "UiScanProgressEvent"
        - tag: 4
          name: "task_status"
          type: "UiTaskStatusEvent"
        - tag: 5
          name: "coverage"
          type: "UiCoverageEvent"
        - tag: 6
          name: "context"
          type: "UiContextEvent"
        - tag: 7
          name: "scope_violation"
          type: "UiScopeViolationEvent"
        - tag: 8
          name: "candidate_verified"
          type: "UiCandidateVerifiedEvent"

# ==============================================================================
# 8. CONFIGURATION REGISTRY
# ==============================================================================
configuration:
  registries:
    - name: "SentinelConfig"
      owner_subsystem: "Main"
      hot_reloadable: false
      fields:
        - key: "database_path"
          type: "PathBuf"
          default: "~/.sentinel/projects/"
          validation: "Valid filesystem path"
          env_override: "SENTINEL_DB_PATH"
          description: "Base directory path for SQLite databases and blob storage."
        - key: "log_level"
          type: "String"
          default: "INFO"
          validation: "Must be TRACE, DEBUG, INFO, WARN, or ERROR"
          env_override: "SENTINEL_LOG_LEVEL"
          description: "Global tracing log filter level."
        - key: "max_memory_mb"
          type: "u32"
          default: 4096
          validation: "Range: 512..65536"
          env_override: "SENTINEL_MAX_MEMORY_MB"
          description: "Maximum allowable memory ceiling for the application process."

    - name: "ProxyConfig"
      owner_subsystem: "SUB-01 ProxyEngine"
      hot_reloadable: false
      fields:
        - key: "bind_address"
          type: "String"
          default: "127.0.0.1"
          validation: "Valid IPv4 or IPv6 string"
          env_override: "SENTINEL_PROXY_BIND"
          description: "Local IP address for the proxy listener."
        - key: "port"
          type: "u16"
          default: 8080
          validation: "Range: 1..65535"
          env_override: "SENTINEL_PROXY_PORT"
          description: "Port number for the proxy listener."
        - key: "upstream_proxy"
          type: "Option<String>"
          default: null
          validation: "Valid URI string e.g. http://127.0.0.1:8081 or null"
          env_override: "SENTINEL_UPSTREAM_PROXY"
          description: "Optional upstream forward proxy URL."
        - key: "tls_cert_path"
          type: "String"
          default: "~/.sentinel/ca/sentinel_ca.crt"
          validation: "Valid path to readable CA certificate and key"
          env_override: "SENTINEL_CA_PATH"
          description: "Path to root CA certificate for dynamic TLS MITM generation."

    - name: "ScanConfig"
      owner_subsystem: "SUB-07 ScanOrchestrator"
      hot_reloadable: true
      fields:
        - key: "scope_id"
          type: "Uuid"
          default: "00000000-0000-0000-0000-000000000000"
          validation: "Must exist in scopes table"
          description: "Target Scope UUID defining allowed test targets."
        - key: "concurrency_limit"
          type: "u32"
          default: 10
          validation: "Range: 1..100"
          description: "Maximum concurrent active testing requests."
        - key: "max_requests_per_endpoint"
          type: "u32"
          default: 500
          validation: "Range: 10..100000"
          description: "Maximum test requests per individual endpoint."
        - key: "active_checks"
          type: "Vec<String>"
          default: ["all_safe"]
          validation: "List of valid security check IDs"
          description: "Enabled security check and rule identifiers."
        - key: "verification_strategies"
          type: "Vec<VerificationStrategy>"
          default: ["ResponseDifferential", "OASTCorrelation", "TimingStatistical", "ContentVerification"]
          validation: "List of enabled verification strategies"
          description: "Active strategies to use for candidate verification."
        - key: "budget"
          type: "ResourceBudget"
          default:
            max_requests: 10000
            max_duration_secs: 3600
          validation: "Valid ResourceBudget object"
          description: "Resource execution bounds for the scan."

    - name: "ResourceBudget"
      owner_subsystem: "SUB-06 TaskScheduler"
      hot_reloadable: true
      fields:
        - key: "max_requests"
          type: "u64"
          default: 10000
          validation: "Range: 100..10000000"
          description: "Total maximum network requests per task."
        - key: "max_duration_secs"
          type: "u64"
          default: 3600
          validation: "Range: 60..86400"
          description: "Maximum task execution duration in seconds."
        - key: "max_findings"
          type: "u32"
          default: 100
          validation: "Range: 1..10000"
          description: "Maximum finding discovery limit before auto-pause."

    - name: "PluginSandboxConfig"
      owner_subsystem: "SUB-20 PluginRuntime"
      hot_reloadable: false
      fields:
        - key: "capabilities"
          type: "CapabilitySet"
          default:
            network: false
            filesystem: false
            secrets: false
            database: false
            browser: false
          validation: "Valid CapabilitySet (default DENY)"
          description: "Granted capability permissions for the plugin."
        - key: "limits"
          type: "ResourceLimits"
          default:
            max_memory_mb: 128
            max_execution_ms: 5000
            max_network_requests: 0
          validation: "Valid ResourceLimits"
          description: "Resource execution ceilings for the plugin."

    - name: "OastConfig"
      owner_subsystem: "SUB-16 OASTServer"
      hot_reloadable: false
      fields:
        - key: "domain"
          type: "String"
          default: "oast.sentinelsec.net"
          validation: "Valid FQDN"
          env_override: "SENTINEL_OAST_DOMAIN"
          description: "Root domain name for out-of-band listener correlation."
        - key: "bind_ip"
          type: "String"
          default: "0.0.0.0"
          validation: "Valid IP string"
          description: "IP address to bind OAST listener daemons."
        - key: "dns_port"
          type: "u16"
          default: 53
          validation: "Port 53 or unprivileged port"
          description: "DNS listener port."
        - key: "http_port"
          type: "u16"
          default: 80
          validation: "Port 80 or unprivileged port"
          description: "HTTP listener port."
        - key: "https_port"
          type: "u16"
          default: 443
          validation: "Port 443 or unprivileged port"
          description: "HTTPS listener port."
        - key: "tls_cert_path"
          type: "Option<String>"
          default: null
          validation: "Path to TLS certificate for HTTPS listener"
          description: "Optional certificate path for OAST HTTPS listener."

    - name: "ReportConfig"
      owner_subsystem: "SUB-14 ReportEngine"
      hot_reloadable: true
      fields:
        - key: "format"
          type: "ReportFormat"
          default: "Pdf"
          validation: "Pdf, Markdown, Json, or Html"
          description: "Desired report output document format."
        - key: "finding_ids"
          type: "Vec<Uuid>"
          default: []
          validation: "List of valid Finding UUIDs"
          description: "Finding entities to include in the exported report."
        - key: "include_evidence"
          type: "bool"
          default: true
          validation: "Boolean"
          description: "Whether to embed raw evidence blobs and screenshots."
        - key: "template"
          type: "Option<String>"
          default: null
          validation: "Valid template name or custom path"
          description: "Custom reporting layout template."
        - key: "include_reproduction_steps"
          type: "bool"
          default: true
          validation: "Boolean"
          description: "Whether to generate automated curl/reproduction steps."

    - name: "AiConfig"
      owner_subsystem: "SUB-18 AIEngine"
      hot_reloadable: true
      fields:
        - key: "provider"
          type: "String"
          default: "openai"
          validation: "Must be 'openai', 'anthropic', 'ollama', or 'custom'"
          env_override: "SENTINEL_AI_PROVIDER"
          description: "LLM backend provider."
        - key: "model"
          type: "String"
          default: "gpt-4o"
          validation: "Model identifier string"
          env_override: "SENTINEL_AI_MODEL"
          description: "Model name."
        - key: "api_key_ref"
          type: "Option<Uuid>"
          default: null
          validation: "UUID of secret reference in OS vault"
          description: "SecretReference UUID for the AI provider API key."
        - key: "max_tokens"
          type: "u32"
          default: 2048
          validation: "Range: 256..16384"
          description: "Maximum tokens per AI completion."
        - key: "temperature"
          type: "f32"
          default: 0.2
          validation: "Range: 0.0..1.0"
          description: "Sampling temperature."

    - name: "ResearchConfig"
      owner_subsystem: "SUB-26..28 Research Tier"
      hot_reloadable: false
      fields:
        - key: "smt_timeout_secs"
          type: "u32"
          default: 30
          validation: "Range: 5..300"
          description: "Maximum solver time limit per symbolic proof."
        - key: "rl_max_episodes"
          type: "u32"
          default: 1000
          validation: "Range: 10..100000"
          description: "Maximum state exploration episodes."
        - key: "crypto_max_pcap_size_mb"
          type: "u32"
          default: 50
          validation: "Range: 1..500"
          description: "Maximum PCAP file size for lattice reduction analysis."

# ==============================================================================
# 9. ERROR MODEL & RECOVERY POLICY
# ==============================================================================
error_model:
  canonical_enum: "SentinelError"
  variants:
    - name: "Database"
      code: "ERR_DB_001"
      retryable: true
      recovery_policy: "Async exponential backoff on retryable lock errors (SQLITE_BUSY). Critical checkpoint updates persist to WAL."
      impacted_subsystems: ["SUB-03 ObservationStore", "SUB-14 ReportEngine", "SUB-06 TaskScheduler"]

    - name: "Io"
      code: "ERR_IO_002"
      retryable: false
      recovery_policy: "Fails operation immediately; logs structured error with file path context."
      impacted_subsystems: ["SUB-01 ProxyEngine", "SUB-20 PluginRuntime", "SUB-14 ReportEngine"]

    - name: "Tantivy"
      code: "ERR_FTS_003"
      retryable: false
      recovery_policy: "Gracefully degrades body search; triggers background Tantivy index rebuild from SQLite WAL."
      impacted_subsystems: ["SUB-03 ObservationStore"]

    - name: "ScopeViolation"
      code: "ERR_SCOPE_004"
      retryable: false
      recovery_policy: "Connection or task aborted immediately; fails closed; emits CriticalEvent::ScopeViolationAttempt."
      impacted_subsystems: ["SUB-01 ProxyEngine", "SUB-07 ScanOrchestrator", "SUB-15 BrowserService", "SUB-22 SubfinderAdapter"]

    - name: "BusOverflow"
      code: "ERR_BUS_005"
      retryable: true
      recovery_policy: "Broadcast channel drops oldest messages for lagging UI consumers; Critical mpsc channel yields publisher."
      impacted_subsystems: ["SUB-05 EventBus", "SUB-07 ScanOrchestrator"]

    - name: "ParseError"
      code: "ERR_PARSE_006"
      retryable: false
      recovery_policy: "Preserves raw byte representation in blob store; logs structured ParseWarning; aborts invalid frame without panic."
      impacted_subsystems: ["SUB-02 HTTPParser", "SUB-25 OpenApiParser"]

    - name: "AiEngine"
      code: "ERR_AI_007"
      retryable: true
      recovery_policy: "Platform degrades to deterministic scanning; core scanning continues unhindered when AI is offline."
      impacted_subsystems: ["SUB-18 AIEngine", "SUB-19 AIPolicyEngine"]

    - name: "SandboxViolation"
      code: "ERR_SANDBOX_008"
      retryable: false
      recovery_policy: "Wasmtime VM traps call immediately; terminates plugin instance; logs security audit event."
      impacted_subsystems: ["SUB-20 PluginRuntime"]

    - name: "InvariantViolation"
      code: "ERR_INVAR_009"
      retryable: false
      recovery_policy: "Triggers safe panic wrapper; SQLite WAL and EventBus checkpointing ensure zero state corruption on restart."
      impacted_subsystems: ["All Subsystems"]

    - name: "TlsError"
      code: "ERR_TLS_010"
      retryable: true
      recovery_policy: "Retries handshake with fallback TLS version/cipher suite."
      impacted_subsystems: ["SUB-01 ProxyEngine", "SUB-16 OASTServer"]

    - name: "NetworkError"
      code: "ERR_NET_011"
      retryable: true
      recovery_policy: "Retries connection up to configured limit with exponential backoff."
      impacted_subsystems: ["SUB-01 ProxyEngine", "SUB-07 ScanOrchestrator", "SUB-15 BrowserService"]

    - name: "Timeout"
      code: "ERR_TIME_012"
      retryable: true
      recovery_policy: "Cancels socket/child process and returns timeout error."
      impacted_subsystems: ["SUB-07 ScanOrchestrator", "SUB-09 VerificationEngine", "SUB-15 BrowserService", "SUB-22..25 Adapters"]

    - name: "AuthError"
      code: "ERR_AUTH_013"
      retryable: false
      recovery_policy: "Invokes token refresh dance if 401; prompts user for updated credentials on permanent failure."
      impacted_subsystems: ["SUB-12 IdentityManager", "SUB-17 AuthorizationEngine"]

    - name: "InvalidConfiguration"
      code: "ERR_CFG_014"
      retryable: false
      recovery_policy: "Rejects invalid configuration at load time with detailed validation diagnostics."
      impacted_subsystems: ["All Subsystems"]

  crash_safe_rules:
    - "Never swallow unrecoverable errors: all errors must propagate to orchestrator or emit structured tracing logs."
    - "SQLite WAL mode with PRAGMA synchronous=NORMAL ensures atomic transactional integrity on unexpected process termination."
    - "EventBus task checkpoints ensure scans resume from last committed step without data loss."
    - "Zero-allocation panic wrappers catch thread unwinding and release socket/file locks safely."

# ==============================================================================
# 10. STORAGE SCHEMA & DATA LAYOUT
# ==============================================================================
storage:
  sqlite:
    pragmas:
      - "PRAGMA journal_mode=WAL;"
      - "PRAGMA synchronous=NORMAL;"
      - "PRAGMA foreign_keys=ON;"
    tables:
      # Group 1: Core Platform & Scopes
      - name: "scopes"
