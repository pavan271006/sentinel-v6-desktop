<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="520" fill="url(#bg)" rx="16" />
  
  <!-- Subtle Grid Accent -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="520" />
    <line x1="250" y1="0" x2="250" y2="520" />
    <line x1="400" y1="0" x2="400" y2="520" />
    <line x1="550" y1="0" x2="550" y2="520" />
    <line x1="700" y1="0" x2="700" y2="520" />
    <line x1="850" y1="0" x2="850" y2="520" />
    <line x1="1000" y1="0" x2="1000" y2="520" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
  </g>

  <!-- Top Hero Header -->
  <g transform="translate(60, 45)">
    <!-- Logo Badge -->
    <rect x="0" y="0" width="48" height="48" rx="10" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1.5" />
    <path d="M 24 10 L 36 15 L 36 28 C 36 35 24 40 24 40 C 24 40 12 35 12 28 L 12 15 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 20 25 L 23 28 L 29 20" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Title & Subtitle -->
    <text x="65" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      SENTINEL V6 <tspan fill="#38bdf8">DESKTOP</tspan>
    </text>
    <text x="65" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
      Open-Source Burp Suite Alternative · Rust Tokio Backend · Native Tauri Engine
    </text>
  </g>

  <!-- Top Right Badges -->
  <g transform="translate(850, 45)">
    <rect x="0" y="8" width="135" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="23" r="5" fill="#10b981" />
    <text x="30" y="28" font-family="sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">127.0.0.1:8085</text>

    <rect x="145" y="8" width="135" height="30" rx="15" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" />
    <text x="162" y="28" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">RAM: 52.4 MB</text>
  </g>

  <!-- Mockup Window Container -->
  <g transform="translate(60, 115)" filter="url(#shadow)">
    <!-- Window Outer Shell -->
    <rect width="1080" height="340" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <path d="M 0 12 Q 0 0 12 0 L 1068 0 Q 1080 0 1080 12 L 1080 40 L 0 40 Z" fill="#0f172a" />
    <line x1="0" y1="40" x2="1080" y2="40" stroke="#1e293b" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="22" cy="20" r="5.5" fill="#ef4444" />
    <circle cx="38" cy="20" r="5.5" fill="#f59e0b" />
    <circle cx="54" cy="20" r="5.5" fill="#10b981" />

    <!-- Navigation Tabs -->
    <g transform="translate(90, 10)">
      <!-- Tab 1: Proxy Active -->
      <rect x="0" y="0" width="95" height="26" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="18" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#f8fafc">🌐 Proxy</text>

      <!-- Tab 2: Repeater -->
      <rect x="105" y="0" width="100" height="26" rx="6" fill="#0f172a" />
      <text x="120" y="17" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">🔁 Repeater</text>

      <!-- Tab 3: Intruder -->
      <rect x="215" y="0" width="145" height="26" rx="6" fill="#0f172a" />
      <text x="228" y="17" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">🚀 Intruder (30k RPS)</text>

      <!-- Tab 4: SQL Scanner -->
      <rect x="370" y="0" width="120" height="26" rx="6" fill="#0f172a" />
      <text x="382" y="17" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">🎯 SQL Scanner</text>

      <!-- Tab 5: OAST Collaborator -->
      <rect x="500" y="0" width="140" height="26" rx="6" fill="#0f172a" />
      <text x="512" y="17" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">📡 OAST Listener</text>
    </g>

    <!-- Content Workspace Split View -->
    <!-- Left Pane: Intercepted Request Stream -->
    <g transform="translate(18, 52)">
      <rect width="520" height="270" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      
      <!-- Sub-header -->
      <path d="M 0 8 Q 0 0 8 0 L 512 0 Q 520 0 520 8 L 520 32 L 0 32 Z" fill="#131d31" />
      <text x="14" y="21" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">RAW HTTP/1.1 INTERCEPT</text>
      <rect x="420" y="6" width="85" height="20" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="0.75" />
      <text x="432" y="19" font-family="sans-serif" font-size="9" font-weight="700" fill="#34d399">JA4 EVASION ON</text>

      <!-- Request Content -->
      <g transform="translate(14, 52)" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="10.5">
        <text y="0" fill="#f43f5e" font-weight="bold">POST <tspan fill="#e2e8f0">/api/v1/auth/session</tspan> <tspan fill="#64748b">HTTP/1.1</tspan></text>
        <text y="18" fill="#94a3b8">Host: <tspan fill="#38bdf8">target-app.internal</tspan></text>
        <text y="36" fill="#94a3b8">User-Agent: <tspan fill="#cbd5e1">Mozilla/5.0 (Windows NT 10.0; Win64; x64)</tspan></text>
        <text y="54" fill="#94a3b8">Accept: <tspan fill="#cbd5e1">application/json, text/plain, */*</tspan></text>
        <text y="72" fill="#94a3b8">Content-Type: <tspan fill="#cbd5e1">application/json</tspan></text>
        <text y="90" fill="#94a3b8">X-Sentinel-Session: <tspan fill="#a78bfa">§authenticated_token§</tspan></text>
        <text y="108" fill="#64748b">---</text>
        <text y="126" fill="#f8fafc">{"user": "<tspan fill="#f59e0b">admin' OR 1=1--</tspan>", "role": "root"}</text>

        <!-- Intercept Action Buttons -->
        <g transform="translate(0, 160)">
          <rect width="70" height="26" rx="4" fill="#10b981" />
          <text x="14" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Forward</text>

          <rect x="80" y="0" width="60" height="26" rx="4" fill="#ef4444" />
          <text x="96" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Drop</text>

          <rect x="150" y="0" width="115" height="26" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="160" y="17" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">Send to Repeater</text>

          <rect x="275" y="0" width="110" height="26" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="288" y="17" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">Send to Fuzzer</text>
        </g>
      </g>
    </g>

    <!-- Right Pane: Fuzzer & Response Telemetry -->
    <g transform="translate(548, 52)">
      <rect width="514" height="270" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />

      <!-- Sub-header -->
      <path d="M 0 8 Q 0 0 8 0 L 506 0 Q 514 0 514 8 L 514 32 L 0 32 Z" fill="#131d31" />
      <text x="14" y="21" font-family="sans-serif" font-size="10" font-weight="700" fill="#10b981">LIVE INTRUDER &amp; OAST METRICS</text>
      <rect x="380" y="6" width="120" height="20" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="0.75" />
      <text x="390" y="19" font-family="sans-serif" font-size="9" font-weight="700" fill="#60a5fa">TOKIO 1,000 CONC</text>

      <!-- Live Table -->
      <g transform="translate(14, 46)" font-family="sans-serif" font-size="10">
        <!-- Header -->
        <text x="5" y="0" fill="#64748b" font-weight="700">#</text>
        <text x="35" y="0" fill="#64748b" font-weight="700">PAYLOAD</text>
        <text x="190" y="0" fill="#64748b" font-weight="700">STATUS</text>
        <text x="260" y="0" fill="#64748b" font-weight="700">LENGTH</text>
        <text x="340" y="0" fill="#64748b" font-weight="700">RTT</text>
        <text x="410" y="0" fill="#64748b" font-weight="700">DIFF</text>

        <line x1="0" y1="8" x2="486" y2="8" stroke="#1e293b" stroke-width="1" />

        <!-- Row 1 -->
        <text x="5" y="26" fill="#94a3b8">001</text>
        <text x="35" y="26" fill="#e2e8f0" font-family="monospace">admin' OR '1'='1</text>
        <text x="190" y="26" fill="#10b981" font-weight="bold">200 OK</text>
        <text x="260" y="26" fill="#94a3b8">4,819 B</text>
        <text x="340" y="26" fill="#38bdf8">1.8 ms</text>
        <text x="410" y="26" fill="#f59e0b" font-weight="bold">+1,204</text>

        <!-- Row 2 -->
        <text x="5" y="48" fill="#94a3b8">002</text>
        <text x="35" y="48" fill="#e2e8f0" font-family="monospace">admin' UNION SELECT 1,2.. </text>
        <text x="190" y="48" fill="#10b981" font-weight="bold">200 OK</text>
        <text x="260" y="48" fill="#94a3b8">5,102 B</text>
        <text x="340" y="48" fill="#38bdf8">2.1 ms</text>
        <text x="410" y="48" fill="#f59e0b" font-weight="bold">+1,487</text>

        <!-- Row 3: OAST Alert -->
        <rect x="0" y="60" width="486" height="26" rx="4" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-width="0.8" />
        <text x="5" y="77" fill="#38bdf8" font-weight="bold">003</text>
        <text x="35" y="77" fill="#38bdf8" font-family="monospace">§oast.sentinel.run§</text>
        <text x="190" y="77" fill="#38bdf8" font-weight="bold">DNS HIT</text>
        <text x="260" y="77" fill="#38bdf8">OAST Callback</text>
        <text x="340" y="77" fill="#38bdf8">0.4 ms</text>
        <text x="410" y="77" fill="#34d399" font-weight="bold">CORRELATED</text>

        <!-- Row 4 -->
        <text x="5" y="104" fill="#94a3b8">004</text>
        <text x="35" y="104" fill="#e2e8f0" font-family="monospace">' AND SLEEP(5)--</text>
        <text x="190" y="104" fill="#64748b">TIMED</text>
        <text x="260" y="104" fill="#94a3b8">3,615 B</text>
        <text x="340" y="104" fill="#ef4444">5,012 ms</text>
        <text x="410" y="104" fill="#64748b">SPRT +</text>

        <!-- Bottom Performance Strip -->
        <g transform="translate(0, 140)">
          <rect width="486" height="42" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
          <text x="15" y="26" fill="#94a3b8" font-size="11">Throughput: <tspan fill="#10b981" font-weight="bold">31,420 RPS</tspan></text>
          <text x="175" y="26" fill="#94a3b8" font-size="11">Active Sockets: <tspan fill="#38bdf8" font-weight="bold">248 persistent</tspan></text>
          <text x="340" y="26" fill="#94a3b8" font-size="11">UI Engine: <tspan fill="#cbd5e1" font-weight="bold">30 FPS Batched</tspan></text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Badges Strip -->
  <g transform="translate(60, 475)" font-family="sans-serif" font-size="12" font-weight="600">
    <text x="0" y="15" fill="#38bdf8">⚡ Sub-100MB RAM (Zero JVM)</text>
    <text x="240" y="15" fill="#34d399">🚀 Unthrottled Parameter Fuzzer</text>
    <text x="520" y="15" fill="#a78bfa">📡 Built-in OAST Burp Collaborator</text>
    <text x="830" y="15" fill="#f59e0b">🛡️ Differential Multi-Oracle SQLi</text>
  </g>
</svg>
